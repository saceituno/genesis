name: recon
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/recon*.py'
      - '.github/workflows/recon.yml'
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests beautifulsoup4 lxml
      - run: python tools/recon5.py
